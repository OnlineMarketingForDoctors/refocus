<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Landing Pages | Refocus The Brain Hub</title>
  <link rel="icon" href="adhd-assessment-adults/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #001331; --raspberry: #a8245a; --blush: #f7e8ec; --porcelain: #fcfaf9; --ink-soft: #3c4a63; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Figtree", system-ui, sans-serif; color: var(--navy); background: var(--porcelain); line-height: 1.6; }
    header { background: var(--navy); color: #fff; padding: 48px 0 96px; }
    .wrap { width: min(100% - 32px, 1100px); margin-inline: auto; }
    header img { width: 160px; height: auto; display: block; margin-bottom: 40px; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; margin: 0 0 12px; }
    header p { margin: 0; color: rgba(255, 255, 255, 0.78); max-width: 60ch; }
    main { margin-top: -56px; padding-bottom: 80px; }
    .pages { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .page { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 18px 50px -24px rgba(0, 19, 49, 0.35); transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .page:hover { transform: translateY(-4px); box-shadow: 0 30px 70px -30px rgba(0, 19, 49, 0.5); }
    .page a { display: block; color: inherit; text-decoration: none; }
    .page a:focus-visible { outline: 3px solid #22b5c9; outline-offset: -3px; border-radius: 24px; }
    .page img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; object-position: 70% center; display: block; }
    .page .body { padding: 22px 24px 26px; }
    .page h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.5rem; line-height: 1.2; margin: 0 0 6px; }
    .page p { margin: 0 0 14px; color: var(--ink-soft); font-size: 0.97rem; }
    .page .slug { display: inline-block; background: var(--blush); color: var(--raspberry); font-weight: 800; font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <img src="adhd-assessment-adults/img/logo-white.webp" alt="Refocus The Brain Hub" width="400" height="137">
      <h1>Landing pages</h1>
      <p>Campaign landing pages for Refocus The Brain Hub.</p>
    </div>
  </header>
  <main class="wrap">
    <!-- Add each new landing page as another <li class="page"> below. -->
    <ul class="pages">
      <li class="page">
        <a href="/adhd-assessment-adults/">
          <img src="adhd-assessment-adults/video/hero-poster.webp" alt="" width="1920" height="1080">
          <div class="body">
            <h2>Adult ADHD assessment</h2>
            <p>Google Ads landing page for private adult ADHD assessments in Manchester and online.</p>
            <span class="slug">/adhd-assessment-adults/</span>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
